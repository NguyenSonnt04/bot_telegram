[project]
name = "tele-shop-workspace"
version = "0.1.0"
description = "Workspace for the Telegram Digital Shop services."
requires-python = ">=3.13,<3.14"
dependencies = [
    "tele-shop-api",
    "tele-shop-bot",
]

[tool.uv]
package = false

[tool.uv.sources]
tele-shop-api = { workspace = true }
tele-shop-bot = { workspace = true }

[tool.uv.workspace]
members = [
    "apps/api-service",
    "apps/bot-service",
]

[dependency-groups]
dev = [
    "httpx2>=2.10.0",
    "pytest>=9.1.1",
    "ruff>=0.16.3",
]

[tool.pytest.ini_options]
testpaths = [
    "apps/api-service/tests",
    "apps/bot-service/tests",
    "tests",
]

[tool.ruff]
target-version = "py313"
line-length = 100
src = [
    "apps/api-service/src",
    "apps/bot-service/src",
]
extend-exclude = [
    ".agents",
    ".harness-core",
    ".venv",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
