[project]
name = "tele-shop-workspace"
version = "0.1.0"
description = "Workspace for the Telegram Digital Shop services."
requires-python = ">=3.13,<3.14"
dependencies = [
    "tele-shop-api",
    "tele-shop-bot",
]

[tool.uv]
package = false

[tool.uv.sources]
tele-shop-api = { workspace = true }
tele-shop-bot = { workspace = true }

[tool.uv.workspace]
members = [
    "apps/api-service",
    "apps/bot-service",
]
