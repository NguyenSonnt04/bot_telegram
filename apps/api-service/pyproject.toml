[project]
name = "tele-shop-api"
version = "0.1.0"
description = "Business API for the Telegram Digital Shop platform."
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.18,<2",
    "asyncpg>=0.31,<1",
    "fastapi>=0.141.1",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.48,<3",
    "uvicorn>=0.52.3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/api_service"]
